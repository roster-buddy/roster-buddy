name: Deploy Roster Buddy Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web app
        run: flutter build web --release --base-href "/roster-buddy/" --no-wasm-dry-run

      - name: Version web assets
        env:
          ROSTER_BUILD_ID: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path('build/web')
          version = os.environ['ROSTER_BUILD_ID']
          bootstrap = (root / 'flutter_bootstrap.js').read_text()
          assert '__ROSTER_BUILD__' in bootstrap
          versioned_bootstrap = f'flutter_bootstrap.{version}.js'
          (root / versioned_bootstrap).write_text(bootstrap.replace('__ROSTER_BUILD__', version))
          (root / f'main.{version}.dart.js').write_bytes((root / 'main.dart.js').read_bytes())
          index = (root / 'index.html').read_text().replace('src="flutter_bootstrap.js"', f'src="{versioned_bootstrap}"')
          assert versioned_bootstrap in index
          (root / 'index.html').write_text(index)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
