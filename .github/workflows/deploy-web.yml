name: Deploy Roster Buddy Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Use the Ubuntu HTTPS package mirror
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -name '*.sources' -o -name '*.list' \) \
            -exec sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          fi

      - name: Prepare browser scanner
        # Playwright's Ubuntu browser dependencies can take longer than ten
        # minutes on a fresh runner. Keep real browser checks enabled.
        timeout-minutes: 30
        run: |
          npm ci --prefix browser-scanner
          npm test --prefix browser-scanner
          node --test browser-scanner/push.test.mjs
          npm run prepare-assets --prefix browser-scanner
          cd browser-scanner
          npx playwright install --with-deps chromium webkit
          npm run test-browser
          cd ..
          dart run browser-scanner/validate.dart

      - name: Build web app
        run: >-
          flutter build web --release --base-href "/roster-buddy/" --no-wasm-dry-run
          --build-number "${{ github.run_number }}"
          --dart-define=APP_BUILD_NUMBER=${{ github.run_number }}.${{ github.run_attempt }}
          --dart-define=APP_BUILD_REVISION=${{ github.sha }}

      - name: Version web assets
        env:
          ROSTER_BUILD_ID: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path('build/web')
          version = os.environ['ROSTER_BUILD_ID']
          bootstrap = (root / 'flutter_bootstrap.js').read_text()
          assert '__ROSTER_BUILD__' in bootstrap
          versioned_bootstrap = f'flutter_bootstrap.{version}.js'
          (root / versioned_bootstrap).write_text(bootstrap.replace('__ROSTER_BUILD__', version))
          (root / f'main.{version}.dart.js').write_bytes((root / 'main.dart.js').read_bytes())
          index = (root / 'index.html').read_text().replace('src="flutter_bootstrap.js"', f'src="{versioned_bootstrap}"')
          assert versioned_bootstrap in index
          scanner = f'roster_scanner.{version}.mjs'
          (root / scanner).write_bytes((root / 'roster_scanner.mjs').read_bytes())
          index = index.replace('src="roster_scanner.mjs"', f'src="{scanner}"')
          push = f'roster_push.{version}.mjs'
          (root / push).write_bytes((root / 'roster_push.mjs').read_bytes())
          index = index.replace('src="roster_push.mjs"', f'src="{push}"')
          (root / 'index.html').write_text(index)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
