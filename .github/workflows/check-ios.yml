name: Check Native iPhone Build

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/check-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ios
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Compile native scanner and plugins
        # Compile for a physical iPhone target because ML Kit's MLImage
        # framework does not contain an iOS Simulator arm64 slice.
        # This remains an unsigned validation build and cannot be installed;
        # device testing still needs Apple code signing.
        run: flutter build ios --release --no-codesign
